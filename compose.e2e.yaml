services:
  app-e2e:
    build:
      context: .
      target: development
    command: sh -c "npm install && npm run db:migrate && npm run dev -- --hostname 0.0.0.0"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://configura:configura_test_local_only@db-e2e:5432/configura_test
      BETTER_AUTH_URL: http://localhost:3001
      MINIO_ENDPOINT: minio-e2e
      NEXT_DIST_DIR: .next-e2e
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
    depends_on:
      db-e2e:
        condition: service_healthy
      minio-e2e:
        condition: service_started

  minio-e2e:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: configura_local
      MINIO_ROOT_PASSWORD: configura_local_only
    volumes:
      - e2e_minio_data:/data

  db-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: configura_test
      POSTGRES_USER: configura
      POSTGRES_PASSWORD: configura_test_local_only
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U configura -d configura_test
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - e2e_postgres_data:/var/lib/postgresql/data

volumes:
  e2e_node_modules:
  e2e_postgres_data:
  e2e_minio_data:
